<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0E11">
<title>GREENLIGHT — Live LA Parking</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0B0E11;
    --panel:#12171De6;
    --panel-solid:#12171D;
    --line:#232B33;
    --fog:#8A93A0;
    --headlight:#F2F4F6;
    --go:#2AE58D;
    --stop:#FF4D5E;
    --meter-amber:#D9A62E;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:var(--asphalt);
    color:var(--headlight);
  }
  #map{position:fixed;inset:0;background:var(--asphalt)}
  .leaflet-container{background:var(--asphalt);font:inherit}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
    background:linear-gradient(to bottom, #0B0E11f2 0%, #0B0E11cc 60%, transparent 100%);
    pointer-events:none;
  }
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;pointer-events:auto}
  .wordmark{
    font-weight:900;font-stretch:118%;font-size:22px;letter-spacing:.06em;line-height:1;
  }
  .wordmark .green{color:var(--go)}
  .statline{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--fog);
    letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  }
  .statline b{color:var(--go);font-weight:600}
  .statline .r{color:var(--stop);font-weight:600}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);
    color:var(--headlight);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:border-color .18s,color .18s;
  }
  .chip.active{border-color:var(--go);color:var(--go)}
  .chip:focus-visible{outline:2px solid var(--go);outline-offset:2px}

  /* ---------- bottom sheet ---------- */
  .sheet{
    position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:1000;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);
  }
  .sheet-title{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--fog);
  }
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--go);margin-right:7px;vertical-align:1px}
  @media (prefers-reduced-motion:no-preference){
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  }
  .countdown{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--fog)}
  .spots{max-height:34vh;overflow-y:auto}
  .spot{
    display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
    padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .spot:last-child{border-bottom:none}
  .spot:active{background:#1A222B}
  .spot-dist{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:var(--go);
    display:flex;flex-direction:column;line-height:1.15;
  }
  .spot-dist small{font-weight:400;font-size:9px;color:var(--fog);letter-spacing:.08em}
  .spot-addr{font-weight:700;font-size:14px;letter-spacing:.01em}
  .spot-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--fog);margin-top:3px}
  .go-btn{
    border:1px solid var(--go);color:var(--go);background:transparent;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;
    padding:9px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .go-btn:active{background:var(--go);color:var(--asphalt)}
  .empty{
    padding:22px 16px;text-align:center;color:var(--fog);
    font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;letter-spacing:.04em;
  }
  .empty b{color:var(--headlight)}

  /* ---------- floating controls ---------- */
  .fab-col{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:999;display:flex;flex-direction:column;gap:8px;transition:bottom .2s}
  .fab{
    width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(12px);color:var(--headlight);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;
  }
  .fab:focus-visible{outline:2px solid var(--go);outline-offset:2px}

  /* ---------- legend ---------- */
  .legend{
    position:fixed;left:12px;z-index:999;
    display:flex;gap:12px;padding:7px 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--fog);
    text-transform:uppercase;transition:bottom .2s;
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-.5px}
  .dot.g{background:var(--go)} .dot.r{background:var(--stop)} .dot.a{background:var(--meter-amber)}

  /* ---------- banner ---------- */
  .banner{
    position:fixed;top:calc(env(safe-area-inset-top) + 88px);left:12px;right:12px;z-index:1001;
    background:var(--panel-solid);border:1px solid var(--stop);border-radius:10px;
    padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--headlight);display:none;
  }
  .banner.show{display:block}
  .banner b{color:var(--stop)}

  /* ---------- leaflet popup ---------- */
  .leaflet-popup-content-wrapper{
    background:var(--panel-solid);color:var(--headlight);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 30px #000a;
  }
  .leaflet-popup-tip{background:var(--panel-solid)}
  .leaflet-popup-content{margin:12px 14px;font-family:'Archivo',sans-serif}
  .pp-state{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em}
  .pp-state.v{color:var(--go)} .pp-state.o{color:var(--stop)} .pp-state.u{color:var(--meter-amber)}
  .pp-addr{font-weight:800;font-size:14px;margin:4px 0 2px}
  .pp-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--fog);line-height:1.7}
  .pp-nav{display:inline-block;margin-top:8px;color:var(--go);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-decoration:none;border-bottom:1px solid var(--go)}
  .leaflet-control-attribution{background:#0B0E11cc !important;color:#5c6570 !important;font-size:9px !important}
  .leaflet-control-attribution a{color:#7d8792 !important}
  .leaflet-top.leaflet-left{top:auto}
  .leaflet-control-zoom{display:none}
</style>
</head>
<body>

<div id="map"></div>

<header class="topbar">
  <div class="brandrow">
    <div class="wordmark">GREEN<span class="green">LIGHT</span></div>
    <div class="statline" id="statline">CONNECTING TO LADOT&hellip;</div>
  </div>
  <nav class="chips" id="chips">
    <button class="chip active" data-area="dtla"  data-lat="34.0480" data-lng="-118.2520" data-z="16">DTLA</button>
    <button class="chip" data-area="hollywood"    data-lat="34.1016" data-lng="-118.3387" data-z="16">HOLLYWOOD</button>
    <button class="chip" data-area="westwood"     data-lat="34.0611" data-lng="-118.4460" data-z="16">WESTWOOD</button>
    <button class="chip" id="locateChip">&#9678; MY LOCATION</button>
  </nav>
</header>

<div class="banner" id="banner"></div>

<div class="legend" id="legend" style="bottom:calc(env(safe-area-inset-bottom) + 10px)">
  <span><span class="dot g"></span>Open</span>
  <span><span class="dot r"></span>Taken</span>
  <span><span class="dot a"></span>No sensor</span>
</div>

<div class="fab-col" id="fabCol">
  <button class="fab" id="refreshBtn" title="Refresh now" aria-label="Refresh occupancy now">&#8635;</button>
  <button class="fab" id="sheetBtn" title="Nearest open meters" aria-label="Toggle nearest open meters">&#9776;</button>
</div>

<section class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <div class="sheet-title"><span class="pulse"></span>Nearest open meters</div>
    <div class="countdown" id="countdown">--</div>
  </div>
  <div class="spots" id="spots">
    <div class="empty">Move the map over a sensor zone.<br><b>DTLA · Hollywood · Westwood</b></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------- config ----------------
  var INVENTORY_URL = "https://data.lacity.org/resource/s49e-q6j2.json"; // LADOT Metered Parking Inventory & Policies
  var OCCUPANCY_URL = "https://data.lacity.org/resource/e7h6-4a3e.json"; // LADOT Parking Meter Occupancy (live)
  var REFRESH_SECS  = 60;

  // ---------------- map ----------------
  var map = L.map("map", { zoomControl:false, attributionControl:true })
             .setView([34.0480, -118.2520], 16);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution:'&copy; OpenStreetMap &copy; CARTO · Data: LADOT / LA Open Data',
    maxZoom:19, subdomains:"abcd"
  }).addTo(map);

  var canvas = L.canvas({ padding:0.4 });
  var markerLayer = L.layerGroup().addTo(map);
  var youMarker = null;

  // ---------------- state ----------------
  var inventory = {};      // spaceid -> {lat,lng,addr,rate,limit,policy}
  var occupancy = {};      // spaceid -> "VACANT" | "OCCUPIED"
  var markers = {};        // spaceid -> circleMarker
  var userPos = null;
  var timerLeft = REFRESH_SECS;
  var loaded = false;

  var $ = function(id){ return document.getElementById(id); };

  function banner(msg){
    var b = $("banner");
    if(!msg){ b.classList.remove("show"); return; }
    b.innerHTML = msg; b.classList.add("show");
  }

  // ---------------- data: inventory ----------------
  function parseLatLng(row){
    var ll = row.latlng || row.location || null;
    if(ll){
      if(ll.latitude !== undefined) return [parseFloat(ll.latitude), parseFloat(ll.longitude)];
      if(ll.coordinates)            return [parseFloat(ll.coordinates[1]), parseFloat(ll.coordinates[0])];
    }
    if(row.lat !== undefined && (row.lon !== undefined || row.lng !== undefined))
      return [parseFloat(row.lat), parseFloat(row.lon !== undefined ? row.lon : row.lng)];
    return null;
  }

  function loadInventory(){
    // Try a viewport query first; fall back to a bulk pull if the field name differs.
    var b = map.getBounds().pad(0.6);
    var whereUrl = INVENTORY_URL + "?$limit=8000&$where=" + encodeURIComponent(
      "within_box(latlng," + b.getNorth() + "," + b.getWest() + "," + b.getSouth() + "," + b.getEast() + ")"
    );
    return fetch(whereUrl)
      .then(function(r){ if(!r.ok) throw new Error("box query " + r.status); return r.json(); })
      .catch(function(){ return fetch(INVENTORY_URL + "?$limit=40000").then(function(r){
          if(!r.ok) throw new Error("inventory " + r.status); return r.json(); }); })
      .then(function(rows){
        rows.forEach(function(row){
          var id = row.spaceid || row.space_id || row.meterid;
          var pos = parseLatLng(row);
          if(!id || !pos || isNaN(pos[0])) return;
          inventory[id] = {
            lat:pos[0], lng:pos[1],
            addr:  row.blockface || row.block_face || ("Meter " + id),
            rate:  row.raterange || row.rate_range || row.rate || "",
            limit: row.metered_time_limit || row.timelimit || row.time_limit || "",
            policy:row.parkingpolicy || row.parking_policy || ""
          };
        });
      });
  }

  // ---------------- data: occupancy ----------------
  function loadOccupancy(){
    return fetch(OCCUPANCY_URL + "?$limit=20000")
      .then(function(r){ if(!r.ok) throw new Error("occupancy " + r.status); return r.json(); })
      .then(function(rows){
        occupancy = {};
        rows.forEach(function(row){
          var id = row.spaceid || row.space_id;
          var st = String(row.occupancystate || row.occupancy_state || "").toUpperCase();
          if(id && st) occupancy[id] = st;
        });
      });
  }

  // ---------------- render ----------------
  function stateOf(id){
    var s = occupancy[id];
    if(s === "VACANT") return "open";
    if(s === "OCCUPIED") return "taken";
    return "unknown";
  }
  var COLORS = { open:"#2AE58D", taken:"#FF4D5E", unknown:"#D9A62E" };

  function popupHtml(id, item, st){
    var label = st==="open" ? "&#9679; OPEN NOW" : st==="taken" ? "&#9679; TAKEN" : "&#9679; NO LIVE SENSOR";
    var cls   = st==="open" ? "v" : st==="taken" ? "o" : "u";
    var nav = "https://www.google.com/maps/dir/?api=1&destination=" + item.lat + "," + item.lng;
    return '<div class="pp-state ' + cls + '">' + label + '</div>' +
           '<div class="pp-addr">' + item.addr + '</div>' +
           '<div class="pp-meta">Space ' + id +
             (item.rate  ? ' &middot; ' + item.rate : '') +
             (item.limit ? ' &middot; ' + item.limit + ' limit' : '') +
             (item.policy? '<br>' + item.policy : '') + '</div>' +
           '<a class="pp-nav" href="' + nav + '" target="_blank" rel="noopener">NAVIGATE &rarr;</a>';
  }

  function render(){
    var b = map.getBounds().pad(0.15);
    var zoom = map.getZoom();
    if(zoom < 14){ markerLayer.clearLayers(); markers = {}; updateStats(); updateSheet(); return; }

    var wanted = {};
    Object.keys(inventory).forEach(function(id){
      var it = inventory[id];
      if(!b.contains([it.lat, it.lng])) return;
      wanted[id] = true;
      var st = stateOf(id);
      var m = markers[id];
      if(!m){
        m = L.circleMarker([it.lat, it.lng], {
          renderer:canvas, radius: st==="unknown" ? 3.5 : 5.5,
          color:"#0B0E11", weight:1.5, fillColor:COLORS[st], fillOpacity: st==="unknown" ? .5 : .95
        }).addTo(markerLayer);
        m.bindPopup(function(){ return popupHtml(id, inventory[id], stateOf(id)); });
        markers[id] = m;
      } else {
        m.setStyle({ fillColor:COLORS[st], radius: st==="unknown" ? 3.5 : 5.5, fillOpacity: st==="unknown" ? .5 : .95 });
      }
    });
    Object.keys(markers).forEach(function(id){
      if(!wanted[id]){ markerLayer.removeLayer(markers[id]); delete markers[id]; }
    });
    updateStats(); updateSheet();
  }

  function updateStats(){
    var open=0, taken=0;
    var b = map.getBounds();
    Object.keys(markers).forEach(function(id){
      var it = inventory[id];
      if(!b.contains([it.lat,it.lng])) return;
      var st = stateOf(id);
      if(st==="open") open++; else if(st==="taken") taken++;
    });
    if(!loaded) return;
    if(open+taken === 0){
      $("statline").innerHTML = map.getZoom()<14 ? "ZOOM IN TO SCAN" : "NO SENSORS IN FRAME";
    } else {
      $("statline").innerHTML = "<b>" + open + " OPEN</b> &middot; <span class='r'>" + taken + " TAKEN</span>";
    }
  }

  // ---------------- nearest open ----------------
  function dist(a,b,c,d){
    var R=6371000, p=Math.PI/180;
    var x=(c-a)*p, y=(d-b)*p;
    var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)*Math.sin(y/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function fmtDist(m){
    if(m < 300) return Math.round(m/10)*10 + "m";
    return (m/1609).toFixed(1) + "mi";
  }
  function parseRate(rate){
    var m = /([\d.]+)/.exec(rate||""); return m ? parseFloat(m[1]) : 99;
  }

  function updateSheet(){
    var origin = userPos || [map.getCenter().lat, map.getCenter().lng];
    var open = [];
    Object.keys(inventory).forEach(function(id){
      if(stateOf(id)!=="open") return;
      var it = inventory[id];
      var d = dist(origin[0],origin[1],it.lat,it.lng);
      if(d > 2500) return;
      open.push({id:id, it:it, d:d});
    });
    // rank: mostly distance, nudged by price (cheaper = better parking)
    open.sort(function(a,b){ return (a.d + parseRate(a.it.rate)*40) - (b.d + parseRate(b.it.rate)*40); });
    open = open.slice(0,4);

    var el = $("spots");
    if(!open.length){
      el.innerHTML = '<div class="empty">No open sensored meters in range.<br><b>Try DTLA, Hollywood or Westwood</b> — those are the zones LADOT has live sensors in.</div>';
      return;
    }
    el.innerHTML = open.map(function(s){
      var nav = "https://www.google.com/maps/dir/?api=1&destination=" + s.it.lat + "," + s.it.lng;
      return '<div class="spot" data-lat="'+s.it.lat+'" data-lng="'+s.it.lng+'" data-id="'+s.id+'">' +
        '<div class="spot-dist">'+fmtDist(s.d)+'<small>'+(userPos?"FROM YOU":"FROM VIEW")+'</small></div>' +
        '<div><div class="spot-addr">'+s.it.addr+'</div>' +
        '<div class="spot-meta">'+ [s.it.rate, s.it.limit ? s.it.limit+" limit" : ""].filter(Boolean).join(" · ") +'</div></div>' +
        '<a class="go-btn" href="'+nav+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">GO &rarr;</a></div>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".spot"), function(node){
      node.addEventListener("click", function(){
        var la=parseFloat(node.dataset.lat), ln=parseFloat(node.dataset.lng);
        map.setView([la,ln], 18);
        var m = markers[node.dataset.id];
        if(m) m.openPopup();
      });
    });
  }

  // ---------------- refresh loop ----------------
  function refresh(){
    $("refreshBtn").style.opacity = .4;
    loadOccupancy()
      .then(function(){ banner(null); loaded = true; render(); })
      .catch(function(){
        banner("<b>Couldn't reach LADOT live data.</b> If you're viewing this inside a sandboxed preview, external API calls may be blocked — deploy the file (GitHub Pages works) and it will connect. Otherwise the city feed may be briefly down.");
      })
      .then(function(){ $("refreshBtn").style.opacity = 1; timerLeft = REFRESH_SECS; });
  }

  setInterval(function(){
    timerLeft--;
    $("countdown").textContent = "REFRESH " + (timerLeft<10?"0":"") + timerLeft + "s";
    if(timerLeft<=0) refresh();
  }, 1000);

  // ---------------- boot ----------------
  $("statline").textContent = "CONNECTING TO LADOT…";
  loadInventory()
    .then(function(){ return loadOccupancy(); })
    .then(function(){ loaded = true; render(); $("sheet").hidden = false; layoutBottom(); })
    .catch(function(){
      banner("<b>Couldn't load LADOT data.</b> If you're viewing this inside a sandboxed preview, external API calls may be blocked — deploy the file (GitHub Pages is the fastest test) and it will pull live data from data.lacity.org.");
      $("statline").textContent = "OFFLINE";
    });

  map.on("moveend zoomend", render);

  // ---------------- UI wiring ----------------
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-area]"), function(chip){
    chip.addEventListener("click", function(){
      document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
      chip.classList.add("active");
      map.setView([parseFloat(chip.dataset.lat), parseFloat(chip.dataset.lng)], parseInt(chip.dataset.z,10));
    });
  });

  $("locateChip").addEventListener("click", function(){
    document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
    this.classList.add("active");
    if(!navigator.geolocation){ banner("<b>No geolocation available</b> in this browser."); return; }
    navigator.geolocation.getCurrentPosition(function(p){
      userPos = [p.coords.latitude, p.coords.longitude];
      if(youMarker) map.removeLayer(youMarker);
      youMarker = L.circleMarker(userPos, {radius:7, color:"#F2F4F6", weight:2, fillColor:"#F2F4F6", fillOpacity:.9}).addTo(map);
      map.setView(userPos, 16);
    }, function(){
      banner("<b>Location denied.</b> Ranking open meters from map center instead.");
    }, {enableHighAccuracy:true, timeout:8000});
  });

  $("refreshBtn").addEventListener("click", refresh);

  function layoutBottom(){
    var open = !$("sheet").hidden;
    var h = open ? $("sheet").offsetHeight + 18 : 10;
    $("legend").style.bottom = "calc(env(safe-area-inset-bottom) + " + h + "px)";
    $("fabCol").style.bottom = "calc(env(safe-area-inset-bottom) + " + h + "px)";
  }
  $("sheetBtn").addEventListener("click", function(){
    $("sheet").hidden = !$("sheet").hidden;
    layoutBottom();
  });
  window.addEventListener("resize", layoutBottom);
  new MutationObserver(layoutBottom).observe($("spots"), {childList:true, subtree:true});
})();
</script>
</body>
</html>
